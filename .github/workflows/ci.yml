name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Linux + macOS (x86_64 and arm64): test the whole workspace with the LLVM/MLIR backend
  # enabled. `--features llvm` only touches `rust-lms`, and with it on, every high-level-API
  # test runs on BOTH Cranelift and LLVM via the tests/common harness — so this single run is
  # a live differential check and there is no need for a separate Cranelift-only pass here.
  # The feature links a system LLVM/MLIR 22 (docs/llvm.md): apt.llvm.org on Linux, Homebrew
  # `llvm@22` on macOS.
  both-backends:
    name: ${{ matrix.target }} (llvm)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            os: linux
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os: linux
          - runner: macos-15
            target: aarch64-apple-darwin
            os: macos

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install LLVM/MLIR 22 (Linux, apt.llvm.org)
        if: matrix.os == 'linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          . /etc/os-release
          echo "deb http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm22.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            llvm-22 llvm-22-dev libmlir-22-dev mlir-22-tools libpolly-22-dev \
            libclang-22-dev clang-22 zlib1g-dev libzstd-dev
          echo "LLVM_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"

      - name: Install LLVM/MLIR 22 (macOS, Homebrew)
        if: matrix.os == 'macos'
        run: |
          brew install llvm@22
          echo "LLVM_PREFIX=$(brew --prefix llvm@22)" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: llvm-${{ matrix.target }}

      - name: Test workspace on both backends
        env:
          # mlir-sys / melior locate the toolchain through these (LLVM/MLIR major 22).
          MLIR_SYS_220_PREFIX: ${{ env.LLVM_PREFIX }}
          LLVM_SYS_220_PREFIX: ${{ env.LLVM_PREFIX }}
        run: |
          export PATH="$LLVM_PREFIX/bin:$PATH"
          export LD_LIBRARY_PATH="$LLVM_PREFIX/lib:$LD_LIBRARY_PATH"
          export DYLD_LIBRARY_PATH="$LLVM_PREFIX/lib:$DYLD_LIBRARY_PATH"
          cargo test --workspace --features llvm --target ${{ matrix.target }}

  # Windows (x86_64 and arm64): the LLVM backend is not exercised here (no MLIR toolchain
  # provisioning), so these run the default Cranelift backend across the whole workspace.
  windows:
    name: ${{ matrix.target }} (cranelift)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Test workspace
        run: cargo test --workspace --all-targets --target ${{ matrix.target }}
