[package]
name = "sql-gen"
version = "0.1.0"
edition = "2024"

[dependencies]
datafusion-sql.workspace = true
arrow.workspace = true
rust-lms.workspace = true
rust-lms-std.workspace = true
arrow-lms.workspace = true
hashbrown.workspace = true
ahash.workspace = true
datafusion-common.workspace = true
datafusion-expr.workspace = true
datafusion-functions.workspace = true
datafusion-functions-aggregate.workspace = true
datafusion-optimizer.workspace = true
# Referenced by code generated by `#[extern_fn]`.
cranelift-codegen.workspace = true

[features]
# Build rust-lms with its LLVM/MLIR backend so queries can be JIT-compiled through
# `JitBackend::Llvm` (the `exec_jit_*_with` entry points). Off by default — needs a
# system LLVM/MLIR 22 toolchain (see docs/llvm.md). With it on, the test suite runs
# every query on both Cranelift and LLVM.
llvm = ["rust-lms/llvm"]

[dev-dependencies]
proptest.workspace = true
