[package]
name = "rust-lms"
version = "0.1.0"
edition.workspace = true

[dependencies]
cranelift-codegen = { workspace = true }
cranelift-frontend = { workspace = true }
cranelift-jit.workspace = true
cranelift-module.workspace = true
cranelift-native.workspace = true
rust-lms-derive = { path = "../rust-lms-derive", optional = true }
# LLVM/MLIR backend (docs/llvm.md, Phase 1+). Optional: needs a system LLVM/MLIR 22
# install via melior/mlir-sys, so it stays OFF by default — the pure-Rust Cranelift
# build is unaffected unless you opt in with `--features llvm`.
melior = { version = "0.27", optional = true }
# Raw MLIR C types (mlir_sys::MlirValue) for the backend's value arena. Same LLVM/MLIR
# 22 system dep as melior; pulled only with `--features llvm`.
mlir-sys = { version = "220.0", optional = true }
# Optional benchmark dependencies (enable via features)
mlua = { version = "0.9", features = ["luajit"], optional = true }
wasmtime = { version = "25", optional = true }
rhai = { version = "1.19", optional = true }

[features]
default = ["derive"]
derive = ["rust-lms-derive"]
llvm = ["dep:melior", "dep:mlir-sys"]
bench-luajit = ["mlua"]
bench-wasm = ["wasmtime"]
bench-rhai = ["rhai"]

[dev-dependencies]
cranelift = { workspace = true }
cranelift-jit = { workspace = true }
cranelift-module = { workspace = true }
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"
either = {workspace = true}

[[bench]]
name = "filtered_sum_two_slices"
harness = false

[[bench]]
name = "backends"
harness = false
