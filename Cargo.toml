[workspace]
members = ["tutorial", "tutorial-derive"]
resolver = "2"

[workspace.dependencies]
# Parsing
nom = "7.1"

# Error handling & diagnostics
thiserror = "1.0"
ariadne = "0.4"

# JIT compilation
cranelift = "0.105"
cranelift-jit = "0.105"
cranelift-module = "0.105"
cranelift-frontend = "0.105"
cranelift-codegen = "0.105"
cranelift-native = "0.105"

arrow = "53.4.1"

# Graph algorithms for SSA
petgraph = "0.6"

# Performance utilities
ahash = "0.8"

# Testing
proptest = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"