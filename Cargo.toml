[workspace]
members = ["rust-lms", "rust-lms-derive", "rust-lms-std", "arrow-lms", "sql-gen"]
resolver = "2"

[workspace.dependencies]
rust-lms = { path = "rust-lms" }
rust-lms-derive = { path = "rust-lms-derive" }
rust-lms-std = { path = "rust-lms-std" }
arrow-lms = { path = "arrow-lms" }
# Parsing
nom = "7.1"

# Error handling & diagnostics
thiserror = "1.0"
ariadne = "0.4"

# JIT compilation
cranelift = "0.127.1"
cranelift-jit = "0.127.1"
cranelift-module = "0.127.1"
cranelift-frontend = "0.127.1"
cranelift-codegen = "0.127.1"
cranelift-native = "0.127.1"

arrow = "58.3.0"
datafusion-sql = "54.1.0"

# Graph algorithms for SSA
petgraph = "0.6"

# Performance utilities
ahash = "0.8"
hashbrown = "0.15"

# Testing
either = "=1.15.0"
proptest = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# sql
datafusion-common = "54.1.0"
datafusion-expr = "54.1.0"
datafusion-functions = "54.1.0"
datafusion-functions-aggregate = "54.1.0"
datafusion-optimizer = "54.1.0"
