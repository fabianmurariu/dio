[package]
name = "rust-lms-std"
version = "0.1.0"
edition.workspace = true

[features]
# Run the same tests through the MLIR/LLVM backend as well. Mirrors `sql-gen`.
llvm = ["rust-lms/llvm"]

[dependencies]
rust-lms = { workspace = true }
# Referenced by code generated by `#[derive(StagedType)]`.
cranelift-codegen = { workspace = true }
# Inline storage for a chunked iterator slot's type-erased iterator (heap fallback when large).
smallbox = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
rand = { workspace = true }

[[bench]]
name = "graph_iter"
harness = false
